[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "painter"
version = "0.1.0"
description = "Automates Canvas pain points for instructors: bulk submission downloads, rosters, grade posting, quiz export."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]          # Excel run log
browser = ["playwright>=1.40"]    # --browser-uploads
gui = ["PySide6>=6.6", "keyring>=24", "openpyxl>=3.1"]   # painter-gui
gui-test = ["painter[gui]", "pytest>=7", "pytest-qt>=4.2"]
dev = ["pytest>=7", "openpyxl>=3.1"]

[project.scripts]
painter = "painter.cli.main:main"

[project.gui-scripts]
painter-gui = "painter.gui.app:main"

[tool.setuptools]
py-modules = ["canvas_fetch_submissions"]

[tool.setuptools.packages.find]
include = ["painter*"]

[tool.setuptools.package-data]
"painter.gui" = ["fonts/*.ttf", "fonts/*.txt", "icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
